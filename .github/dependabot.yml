# Actualizaciones de dependencias (docs/backend/M0 §5). Dependabot abre PRs semanales que pasan por la
# misma verificación que cualquier cambio. Las de seguridad llegan apenas se publican.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 5
    # Espera una semana tras cada versión nueva: da tiempo a que aparezcan fallos o paquetes
    # comprometidos antes de instalarla.
    cooldown:
      default-days: 7
    ignore:
      # @nestjs/swagger acepta TypeScript 5.5 o 6: con la 7 no se puede ni instalar (ERESOLVE).
      # Revisar cuando Nest la soporte.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Los tipos deben coincidir con el Node del runtime (24): con los de una versión mayor, el
      # compilador aceptaría APIs que Node 24 no tiene.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      nest:
        patterns: ['@nestjs/*']
      desarrollo:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ['react', 'react-dom']
    ignore:
      # eslint-config-next trae eslint-plugin-react, que todavía no funciona con ESLint 10
      # («contextOrFilename.getFilename is not a function»). Revisar cuando lo soporte.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # Los tipos deben coincidir con el Node del runtime (24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    cooldown:
      default-days: 7
