# Verificación del backend en cada PR y en cada push a main que toque backend/ (docs/backend/M0 §4.12).
# El despliegue a staging se agrega en el PR 7 de M0, cuando se elija el hosting.
name: Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

# Solo lectura: la verificación no publica nada ni escribe en el repositorio.
permissions:
  contents: read

# Un push nuevo a la misma rama cancela la verificación anterior, que ya no sirve.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Acciones fijadas a un commit exacto: una etiqueta se puede mover, un SHA no.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias (exactas, desde package-lock.json)
        run: npm ci

      - name: Lint y tipos
        run: npm run lint

      - name: Formato
        run: npm run formato:verificar

      - name: Reglas de arquitectura (E13)
        run: npm run arquitectura

      - name: Pruebas unitarias
        run: npm test

      # Integración y API contra un Postgres 17 real (Testcontainers usa el Docker del runner),
      # con los umbrales de cobertura de M0 §4.11.
      - name: Todas las pruebas, con cobertura
        run: npm run test:cobertura

      - name: Compilación
        run: npm run build

      - name: Auditoría de dependencias
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev

  # La imagen de producción (M10): que compile, que use la misma versión de Node que el resto, y que el ARRANQUE SEGURO
  # funcione de verdad: con un adaptador simulado en producción el contenedor se NIEGA a iniciar.
  imagen:
    name: Imagen de producción
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: La imagen usa la misma versión de Node que .nvmrc
        run: |
          esperada="$(tr -d 'v \n' < .nvmrc)"
          actual="$(sed -n 's/^ARG NODE_VERSION=//p' Dockerfile)"
          echo "nvmrc=$esperada dockerfile=$actual"
          test "$esperada" = "$actual"

      - name: Construir la imagen
        run: docker build --tag seniory-backend:ci .

      - name: Corre sin privilegios y sin secretos ni pruebas dentro
        run: |
          test "$(docker run --rm --entrypoint id seniory-backend:ci -u)" != "0"
          ! docker run --rm --entrypoint sh seniory-backend:ci -c 'ls .env pruebas src 2>/dev/null | grep -q .'

      - name: En producción NO arranca con la pasarela simulada
        run: |
          set +e
          salida="$(docker run --rm \
            -e NODE_ENV=production \
            -e URL_BASE_DE_DATOS=postgres://u:p@127.0.0.1:5432/b \
            -e ORIGENES_PERMITIDOS=https://app.seniory.co \
            -e COOKIES_SEGURAS=true \
            -e SECRETO_BFF=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            -e SECRETO_JWT_ACCESO=jjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjj \
            -e REQUIERE_PAGO_APROBADO=true \
            -e PASARELA_DE_PAGOS=simulada \
            -e SECRETO_DE_PASARELA=pppppppppppppppppppppppppppppppppppppppp \
            -e DISPERSOR_DE_PAGOS=simulado \
            -e CANALES_DE_NOTIFICACION_SIMULADOS=true \
            seniory-backend:ci 2>&1)"
          codigo=$?
          echo "$salida"
          test "$codigo" -ne 0
          echo "$salida" | grep -q 'PASARELA_DE_PAGOS no puede ser simulada'
          echo "$salida" | grep -q 'DISPERSOR_DE_PAGOS no puede ser simulado'
          echo "$salida" | grep -q 'CANALES_DE_NOTIFICACION_SIMULADOS no puede ser true'
